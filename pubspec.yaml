name: dart_pytorch
description: >-
  A minimal PyTorch-style tensor library for Dart with reverse-mode
  autograd, hand-written CUDA kernels via dart:ffi, and an nn.Module
  scaffolding for Transformers, GPT, MoE, ViT, and LC0 chess-network
  inference.
version: 0.1.3
homepage: https://github.com/KellyKinyama/dart-pytorch
repository: https://github.com/KellyKinyama/dart-pytorch
issue_tracker: https://github.com/KellyKinyama/dart-pytorch/issues
topics:
  - machine-learning
  - deep-learning
  - tensor
  - cuda
  - autograd

environment:
  sdk: ^3.9.3

dependencies:
  path: ^1.9.0
  ffi: ^2.2.0
  image: ^4.8.0
  fftea: ^1.5.0
  wav: ^1.5.0
  chess: ^0.8.1
  # In-process vector DB used by bin/db_rag_demo.dart.
  dart_db_server: ^0.1.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
